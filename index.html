<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Furniture Card</title>
  <link rel="stylesheet" href=".style.css">
</head>
<body>
  <div class="card">
    <div class="card-left">
      <img src="/images/drawers.jpg" alt="drawers">
    </div>

    <div class="card-right">
      <h2>
        Shift the overall look and feel by adding these wonderful touches to furniture in your home
      </h2>
      <p>
        Ever been in a room and felt like something was missing? Perhaps it felt slightly bare and uninviting.
        I've got some simple tips to help you make any room feel complete.
      </p>


      <div class="card-footer">
        <div class="author">
          <img src="./images/avatar-michelle.jpg" alt="">
          <div class="author-info">
            <h4>Michelle Appleton</h4>
            <span>28 Jun 2020</span>
          </div>
        </div>
        <div class="share">
          <img src="./images/icon-share.svg" alt="Share">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
